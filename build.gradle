plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        name "CaffeineMC"
        url "https://maven.caffeinemc.net/releases" // or /snapshots
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Source files are UTF-8; force the compiler and resource processing to use UTF-8 instead of the
// platform default (GBK on Chinese Windows), which otherwise fails on unmappable characters.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}
sourceSets {
    lotm {
        java.srcDir 'lotm/src/main/java'
        resources.srcDir 'lotm/src/main/resources'
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
 }
 // Iron's Artifice builds from its own Gradle root at irons_artifice/. It is not an ExWorld source set.
 sourceSets.lotm.compileClasspath += sourceSets.main.output
 sourceSets.lotm.runtimeClasspath += sourceSets.main.output


neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        lotm {
            sourceSet(sourceSets.lotm)
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
                data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            loadedMods.set([project.neoForge.mods.getByName(project.mod_id), project.neoForge.mods.lotm])
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
// Existing harnesses are pure Java. Progress harnesses also exercise Minecraft identifiers/NBT, so give the test
// source set the same mapped NeoForge compile/runtime libraries as main without changing production packaging.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

sourceSets.test.compileClasspath += sourceSets.lotm.output
sourceSets.test.runtimeClasspath += sourceSets.lotm.output

dependencies {
    implementation files("libs/exmodifier-1.0-SNAPSHOT.jar")
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"
    implementation "curse.maven:irons-spells-n-spellbooks-855414:8364935"
    implementation "curse.maven:curios-309927:6529130"
    implementation "curse.maven:geckolib-388172:8350073"
    implementation "curse.maven:irons-lib-1492763:8364894"
    implementation "curse.maven:playeranimator-658587:7389814"
    // ExWorld publishes its authoritative battle effects through StylizedDamage's packet API.
    // Keep the mod as a separate JAR; this dependency only adds it to compile/dev runtime classpaths.
    implementation files("libs/stylizeddamage-1211.2.9-fix.jar")


    // Optional client-only compatibility surface; ExWorld uses reflection and does not bundle it.
    compileOnly files("libs/voicecastaddon-1.0.2.jar")
    // Optional client-side integration. The bridge is loaded reflectively so ExWorld also runs
    // without NeoforgeSkyboxes installed; runtimeOnly makes the local client run use the jar in libs.
    compileOnly files("libs/NeoforgeSkyboxes-0.1.1+mc1.21.1.jar")
     runtimeOnly files("libs/NeoforgeSkyboxes-0.1.1+mc1.21.1.jar")
     runtimeOnly files("libs/ApricityUI-neoforge-1.21.1-1.2.5-full.jar")
    compileOnly "net.caffeinemc:sodium-neoforge-api:0.8.13-beta.1+mc1.21.1"
    // The Maven `sodium-neoforge-mod` artifact is intentionally unwrapped. Do not put it on the
    // NeoForge runtime beside the full distribution JAR; their two JPMS modules export the same packages.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"


    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
    // WebView2 uses the JNA 5.14.0 already required by Minecraft. A second version fails NeoForge's strict constraint.

}

// The full Sodium NeoForge distribution lives in run/mods for local client runs. Multiple full
// distributions would still produce duplicate mods, so fail before ModLauncher starts.
tasks.register('verifyNoDuplicateSodium') {
    inputs.files(layout.projectDirectory.dir('run/mods').asFileTree.matching {
        include '*sodium*.jar'
    })
    doLast {
        def manualCopies = inputs.files.files
        if (manualCopies.size() > 1) {
            throw new GradleException("Keep only one Sodium distribution in run/mods: "
                    + manualCopies.collect { it.name }.join(', '))
        }
    }
}

 tasks.register('syncPhoneApricity', Copy) {
     from layout.projectDirectory.file('lotm/src/main/resources/assets/apricityui/apricity/lotm/phone.html')
     into layout.projectDirectory.dir('run/apricity/lotm')
 }
 tasks.named('prepareClientRun') {
     dependsOn tasks.named('verifyNoDuplicateSodium')
     dependsOn 'compileLotmJava', 'processLotmResources', 'syncPhoneApricity'
 }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Optional Windows client window. The loader is Microsoft's redistributable bootstrap DLL, not a GPL-linked library.
def webview2Version = '1.0.4191.47'
def webview2Resources = layout.buildDirectory.dir('generated/webview2')
def extractWebView2Loader = tasks.register('extractWebView2Loader') {
    def nupkg = layout.buildDirectory.file("webview2/Microsoft.Web.WebView2.${webview2Version}.nupkg")
    inputs.property('webview2Version', webview2Version)
    outputs.dir(webview2Resources)
    doLast {
        def pkg = nupkg.get().asFile
        def dest = webview2Resources.get().file('natives/windows-x64/WebView2Loader.dll').asFile
        dest.parentFile.mkdirs()
        def openZip = { file ->
            try {
                return new java.util.zip.ZipFile(file)
            } catch (java.util.zip.ZipException ignored) {
                return null
            }
        }
        def zip = pkg.isFile() ? openZip(pkg) : null
        if (zip == null || zip.getEntry('runtimes/win-x64/native/WebView2Loader.dll') == null) {
            if (zip != null) zip.close()
            pkg.parentFile.mkdirs()
            def part = new File(pkg.parentFile, pkg.name + '.part')
            def connection = new URI("https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/${webview2Version}").toURL().openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 120000
            connection.setRequestProperty('User-Agent', 'ExWorld-Gradle')
            part.withOutputStream { out -> connection.inputStream.withCloseable { input -> out << input } }
            java.nio.file.Files.move(part.toPath(), pkg.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            zip = new java.util.zip.ZipFile(pkg)
        }
        try {
            def entry = zip.getEntry('runtimes/win-x64/native/WebView2Loader.dll')
            if (entry == null) throw new GradleException('WebView2Loader.dll missing from ' + pkg)
            zip.getInputStream(entry).withCloseable { input ->
                java.nio.file.Files.copy(input, dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            zip.close()
        }
    }
}
sourceSets.main.resources.srcDir(webview2Resources)
tasks.named('processResources').configure { dependsOn(extractWebView2Loader) }
tasks.named('prepareClientRun').configure { dependsOn(extractWebView2Loader) }
neoForge.ideSyncTask extractWebView2Loader


// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

